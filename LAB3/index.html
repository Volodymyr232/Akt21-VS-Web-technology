<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя галерея 2.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 2em;
        }

        main {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            display: block;
        }

        .card p {
            text-align: center;
            padding: 10px;
            margin: 0;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>Моя сучасна фотогалерея</h1>
    </header>

    <main>
        <div class="gallery">
            <div class="card">
                <img src="https://picsum.photos/300/200?1" alt="Фото 1">
                <p>Фото 1</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?2" alt="Фото 2">
                <p>Фото 2</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?3" alt="Фото 3">
                <p>Фото 3</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?4" alt="Фото 4">
                <p>Фото 4</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?5" alt="Фото 5">
                <p>Фото 5</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?6" alt="Фото 6">
                <p>Фото 6</p>
            </div>
            <div class="card">
                <img src="https://picsum.photos/300/200?7" alt="Фото 7">
                <p>Фото 7</p>
            </div>
        </div>
    </main>

</body>
</html>
